<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Bot da Barbearia</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; text-align: center; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #25D366; font-size: 24px; }
        .status { font-weight: bold; padding: 12px; border-radius: 8px; background: #e9ecef; margin-bottom: 25px; font-size: 16px; }
        
        /* Flexbox Responsivo */
        .methods { display: flex; gap: 20px; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; }
        .method-box { flex: 1; min-width: 280px; border: 1px solid #ddd; padding: 20px; border-radius: 10px; background: #fafafa; box-sizing: border-box; }
        
        img { max-width: 100%; height: auto; border-radius: 10px; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #ccc; border-radius: 6px; text-align: center; font-size: 16px; box-sizing: border-box; }
        
        button { background-color: #25D366; color: white; border: none; padding: 12px 20px; margin-top: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; transition: 0.3s; }
        button:hover { background-color: #128C7E; }
        .btn-danger { background-color: #dc3545; margin-top: 25px; }
        .btn-danger:hover { background-color: #c82333; }
        
        #pairing-code-display { font-size: 36px; font-weight: bold; letter-spacing: 6px; color: #128C7E; margin-top: 20px; }
        .hidden { display: none !important; }

        @media (max-width: 650px) {
            .methods { flex-direction: column; }
            .method-box { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>💈 Bot WhatsApp - Barbearia</h1>
        <div class="status">Status: <span id="status-text">A conectar ao servidor... ⏳</span></div>

        <div id="login-section" class="methods">
            <div class="method-box">
                <h3>Opção 1: QR Code</h3>
                <p>Abra o WhatsApp > Dispositivos Conectados e leia o código:</p>
                <img id="qr-image" src="" alt="Aguardar QR Code..." style="display: none;">
            </div>

            <div class="method-box">
                <h3>Opção 2: Nº de Telefone</h3>
                <p>Insira o número (Ex: 25884...):</p>
                <input type="text" id="phone-number" placeholder="258840000000">
                <button onclick="requestPairingCode()">Gerar Código</button>
                <div id="pairing-code-display"></div>
            </div>
        </div>

        <div id="connected-section" class="hidden">
            <h2>🎉 Bot Conectado com Sucesso!</h2>
            <p>O seu bot já está a funcionar e a responder aos clientes.</p>
        </div>

        <button class="btn-danger" onclick="limparSessao()">🔄 Resetar Bot (Usar em caso de erro)</button>
    </div>

    <script>
        const socket = io();

        socket.on('status', (statusStr) => {
            document.getElementById('status-text').innerText = statusStr;
        });

        socket.on('qr_code', (qrBase64) => {
            const img = document.getElementById('qr-image');
            img.src = qrBase64;
            img.style.display = 'block';
        });

        socket.on('codigo_pareamento', (codigo) => {
            // Formata o código com hífen no meio (ex: ABC-DEF)
            if(codigo) {
                const codigoFormatado = codigo.match(/.{1,4}/g).join('-'); 
                document.getElementById('pairing-code-display').innerText = codigoFormatado;
            }
        });

        socket.on('erro', (msg) => {
            alert(msg);
            document.getElementById('pairing-code-display').innerText = "";
        });

        socket.on('conectado', () => {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('connected-section').classList.remove('hidden');
        });

        function requestPairingCode() {
            const num = document.getElementById('phone-number').value;
            if (!num) return alert("Por favor, introduza o número de telefone.");
            document.getElementById('pairing-code-display').innerText = "A gerar...";
            socket.emit('solicitar_codigo', num);
        }

        function limparSessao() {
            if(confirm("Tens a certeza? Isto vai apagar a sessão atual e reiniciar o Bot.")) {
                socket.emit('limpar_sessao');
                document.getElementById('status-text').innerText = "A reiniciar servidor...";
                setTimeout(() => window.location.reload(), 3000);
            }
        }
    </script>
</body>
</html>
